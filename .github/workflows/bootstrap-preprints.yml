name: Apply preprint registry payload

on:
  push:
    branches:
      - feat/preprint-frontier-sources
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/preprint-frontier-sources
          fetch-depth: 0

      - name: Apply, validate, and commit payload
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f bootstrap/preprint-update.b64.aa ]; then
            echo "Preprint payload already applied; nothing to do."
            exit 0
          fi

          cat \
            bootstrap/preprint-update.b64.aa \
            bootstrap/preprint-update.b64.ab \
            bootstrap/preprint-update.b64.ac \
            bootstrap/preprint-update.b64.ad \
            bootstrap/preprint-update.b64.ae \
            | base64 --decode > "$RUNNER_TEMP/preprint-update.tar.xz"

          echo "53c9609aeb946562c65563ff9b3421d29b2a0e69580eba81ffe7f0a6e1ba4d1b  $RUNNER_TEMP/preprint-update.tar.xz" | sha256sum --check -
          tar -xJf "$RUNNER_TEMP/preprint-update.tar.xz" -C .
          rm -f bootstrap/preprint-update.b64.*

          python3 scripts/validate_registry.py
          python3 scripts/validate_extensions.py
          rm -rf "$RUNNER_TEMP/open-scholarly-sources-site"
          python3 scripts/build_machine_index.py --output "$RUNNER_TEMP/open-scholarly-sources-site"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data bootstrap/preprint-update.b64.* || true
          git diff --cached --stat
          git commit -m "feat: add frontier preprint and working-paper sources"
          git push origin HEAD:feat/preprint-frontier-sources
