name: Apply Claude-review hardening payload

on:
  push:
    branches:
      - fix/claude-review-hardening
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v6
        with:
          ref: fix/claude-review-hardening
          fetch-depth: 0

      - name: Decode, apply, validate and commit payload
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f bootstrap/hardening-nonworkflow.b64.00 ]; then
            echo "Hardening payload already applied; nothing to do."
            exit 0
          fi

          cat bootstrap/hardening-nonworkflow.b64.00 \
              bootstrap/hardening-nonworkflow.b64.01 \
              bootstrap/hardening-nonworkflow.b64.02 \
              bootstrap/hardening-nonworkflow.b64.03 \
              bootstrap/hardening-nonworkflow.b64.04 \
              bootstrap/hardening-nonworkflow.b64.05 \
            | base64 --decode > "$RUNNER_TEMP/hardening-nonworkflow.tar.xz"
          echo "568c6cd12734a1b3cd562637bb34b90207aa0b1a9d7475175229c2e4a55a9d34  $RUNNER_TEMP/hardening-nonworkflow.tar.xz" | sha256sum --check -

          tar -xJf "$RUNNER_TEMP/hardening-nonworkflow.tar.xz" -C .
          rm -f bootstrap/hardening-nonworkflow.b64.*

          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('data/i18n.zh-TW.integrity-discovery.json')
          doc=json.loads(path.read_text(encoding='utf-8'))
          subjects=doc.setdefault('taxonomy',{}).setdefault('subjects',{})
          subjects['evolutionary biology']='演化生物學'
          subjects['open access']='開放存取'
          path.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          python3 -m py_compile scripts/build_source_profiles.py scripts/build_static_homepage.py
          python3 scripts/validate_registry.py
          python3 scripts/validate_extensions.py

          site="$RUNNER_TEMP/open-scholarly-sources-site"
          rm -rf "$site"
          mkdir -p "$site/data" "$site/schemas"
          cp docs/index.html "$site/index.html"
          cp data/*.json "$site/data/"
          cp schemas/*.json "$site/schemas/"
          python3 scripts/build_machine_index.py --output "$site"
          python3 scripts/build_source_profiles.py --output "$site"
          python3 scripts/build_static_homepage.py --site "$site"
          test -s "$site/registry.json"
          test -s "$site/source-profiles.json"
          test -s "$site/source-profiles.ndjson"
          test -s "$site/profiles/index.html"
          grep -q "Static source index / 無 JavaScript 來源索引" "$site/index.html"
          ! grep -q "<!-- STATIC_FALLBACK -->" "$site/index.html"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            SOURCE_PROFILES.md \
            data/registry-manifest.json \
            data/source-profile-rules.json \
            data/sources.integrity-discovery.json \
            data/i18n.zh-TW.integrity-discovery.json \
            schemas/source-profile.schema.json \
            scripts/build_source_profiles.py \
            scripts/build_static_homepage.py \
            docs/index.html
          git add -u -- bootstrap
          git diff --cached --stat
          git commit -m "feat: harden research discovery and provenance layers"
          git push origin HEAD:fix/claude-review-hardening
