name: Apply cross-disciplinary registry bundle

on:
  push:
    branches:
      - feat/cross-disciplinary-llm-index
    paths:
      - bootstrap/update.tar.gz
      - .github/workflows/bootstrap-cross-disciplinary.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/cross-disciplinary-llm-index

      - name: Apply verified bundle
        run: |
          tar -xzf bootstrap/update.tar.gz -C .
          rm -f bootstrap/update.tar.gz
          rmdir bootstrap
          rm -f .github/workflows/bootstrap-cross-disciplinary.yml

      - name: Validate registry and generated indexes
        run: |
          python3 scripts/validate_registry.py
          python3 scripts/validate_extensions.py
          rm -rf "$RUNNER_TEMP/open-scholarly-sources-site"
          python3 scripts/build_machine_index.py --output "$RUNNER_TEMP/open-scholarly-sources-site"

      - name: Commit applied files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/bootstrap-cross-disciplinary.yml \
            bootstrap/update.tar.gz \
            .github/workflows/pages.yml \
            .github/workflows/validate.yml \
            CONTRIBUTING.md \
            README.md \
            data/registry-manifest.json \
            data/i18n.zh-TW.cross-disciplinary.json \
            data/sources.cross-disciplinary.json \
            data/sources.physical-earth.json \
            data/sources.life-health.json \
            data/sources.social-humanities.json \
            docs/index.html \
            schemas/source.schema.json \
            scripts/build_machine_index.py \
            scripts/validate_extensions.py
          git diff --cached --stat
          git commit -m "feat: add cross-disciplinary OA sources and machine indexes"
          git push origin HEAD:feat/cross-disciplinary-llm-index
