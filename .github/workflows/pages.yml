name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate base registry
        run: python3 scripts/validate_registry.py

      - name: Validate source shards, access policies and bilingual coverage
        run: python3 scripts/validate_extensions.py

      - name: Stage Pages site
        run: |
          rm -rf site
          mkdir -p site/data site/schemas
          cp docs/index.html site/index.html
          cp data/*.json site/data/
          cp schemas/source.schema.json site/schemas/source.schema.json
          python3 scripts/build_machine_index.py --output site
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
