name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout immutable release archive
        uses: actions/checkout@v6
        with:
          ref: release-snapshots
          path: .release-archive
          fetch-depth: 1

      - name: Validate base registry
        run: python3 scripts/validate_registry.py

      - name: Validate source shards, access policies and bilingual coverage
        run: python3 scripts/validate_extensions.py

      - name: Validate retrieval routing policy invariants
        run: python3 scripts/validate_routing_policy.py

      - name: Validate registry-brokered chatbot search routing
        run: python3 scripts/validate_chatbot_search.py

      - name: Run reference-consumer conformance tests
        run: python3 -m unittest -v tests.test_reference_consumer tests.test_chatbot_search

      - name: Stage Pages site and immutable release snapshot
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/data site/schemas
          cp docs/index.html site/index.html
          cp data/*.json site/data/
          cp schemas/*.json site/schemas/
          python3 scripts/build_machine_index.py --output site
          python3 scripts/build_source_profiles.py --output site
          python3 scripts/build_static_homepage.py --site site
          python3 scripts/publish_routing_policy.py --output site
          python3 scripts/publish_chatbot_search.py --output site

          release_date="$(git show -s --format=%cI "$GITHUB_SHA")"
          python3 scripts/build_release_snapshot.py \
            --site site \
            --archive-root .release-archive/releases \
            --release-id "$GITHUB_SHA" \
            --commit-sha "$GITHUB_SHA" \
            --release-date "$release_date"

          snapshot="site/releases/$GITHUB_SHA"
          grep -q "Static source index / 無 JavaScript 來源索引" site/index.html
          ! grep -q "<!-- STATIC_FALLBACK -->" site/index.html
          grep -q "$GITHUB_SHA" site/index.html
          grep -q "Release identity: $GITHUB_SHA" site/llms.txt
          grep -q "Routing policy:" site/llms.txt
          grep -q "Registry-brokered OA search for chatbots" site/llms.txt
          test -s site/retrieval-routing-policy.json
          test -s site/chatbot-search-routing.json
          test -s site/chatbot-search-protocol.md
          test -s site/chatbot-entry.txt
          test -s "$snapshot/release-manifest.json"
          test -s "$snapshot/retrieval-routing-policy.json"
          test -s "$snapshot/chatbot-search-routing.json"
          test -s "$snapshot/chatbot-search-protocol.md"
          test -s "$snapshot/chatbot-entry.txt"
          test -s "$snapshot/schemas/retrieval-routing-policy.schema.json"
          test -s "$snapshot/schemas/chatbot-search-routing.schema.json"
          test -s "$snapshot/index.html"
          test -s "$snapshot/data/registry-manifest.json"
          test -s "$snapshot/data/source-profile-rules.json"
          test -s "$snapshot/data/retrieval-routing-policy.json"
          test -s "$snapshot/data/chatbot-search-routing.json"
          test -s "$snapshot/sources/index.html"
          test -s "$snapshot/profiles/index.html"
          cmp site/index.html "$snapshot/index.html"
          cmp site/retrieval-routing-policy.json "$snapshot/retrieval-routing-policy.json"
          cmp site/chatbot-search-routing.json "$snapshot/chatbot-search-routing.json"
          cmp site/chatbot-search-protocol.md "$snapshot/chatbot-search-protocol.md"
          cmp site/chatbot-entry.txt "$snapshot/chatbot-entry.txt"
          test -s site/release-manifest.json
          test -s site/releases/index.json

          python3 - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          site = Path("site")
          sha = "${{ github.sha }}"
          manifest = json.loads((site / "release-manifest.json").read_text())
          registry = json.loads((site / "registry.json").read_text())
          profiles = json.loads((site / "source-profiles.json").read_text())
          routing = json.loads((site / "retrieval-routing-policy.json").read_text())
          chatbot = json.loads((site / "chatbot-search-routing.json").read_text())
          releases = json.loads((site / "releases" / "index.json").read_text())
          snapshot = Path("site/releases") / sha

          assert manifest["schema_version"] == "4.0.0"
          assert manifest["release_id"] == sha == manifest["commit_sha"]
          assert registry["release"]["release_id"] == sha
          assert profiles["release"]["release_id"] == sha
          assert releases["current_release_id"] == sha

          current_release_entries = [
            entry for entry in releases.get("releases", []) if entry.get("release_id") == sha
          ]
          assert len(current_release_entries) == 1
          current_release = current_release_entries[0]
          assert re.fullmatch(r"^[0-9a-f]{64}$", current_release["manifest_sha256"])
          assert re.fullmatch(r"^[0-9a-f]{40}$", current_release["manifest_git_blob_sha1"])
          snapshot_manifest = (snapshot / "release-manifest.json").read_bytes()
          snapshot_manifest_sha256 = hashlib.sha256(snapshot_manifest).hexdigest()
          snapshot_manifest_git_blob_sha1 = hashlib.sha1(
              b"blob " + str(len(snapshot_manifest)).encode("ascii") + b"\0" + snapshot_manifest
          ).hexdigest()
          assert snapshot_manifest_sha256 == current_release["manifest_sha256"]
          assert snapshot_manifest_git_blob_sha1 == current_release["manifest_git_blob_sha1"]
          assert "release-manifest.json" not in manifest["files"]

          assert chatbot["method"] == "chatbot_registry_brokered_oa_search_v2"
          assert chatbot["default_mode"] == "registry_brokered"
          assert manifest["chatbot_search_brokered_source_count"] == chatbot["brokered_discovery"]["eligible_source_count"]
          assert manifest["chatbot_search_default_mode"] == chatbot["default_mode"]
          assert manifest["chatbot_search_adapter_count"] == len(chatbot["adapters"])

          for required_file in chatbot["bootstrap"]["required_files"]:
            assert (snapshot / required_file).is_file(), required_file
            if required_file != "release-manifest.json":
              assert required_file in manifest["files"], required_file

          for name, meta in manifest["files"].items():
              data = (snapshot / name).read_bytes()
              assert "sha256" in meta
              assert "bytes" in meta
              assert "git_blob_sha1" in meta
              assert re.fullmatch(r"^[0-9a-f]{64}$", meta["sha256"])
              assert re.fullmatch(r"^[0-9a-f]{40}$", meta["git_blob_sha1"])
              assert hashlib.sha256(data).hexdigest() == meta["sha256"], name
              assert len(data) == meta["bytes"], name
              assert hashlib.sha1(
                  b"blob " + str(len(data)).encode("ascii") + b"\0" + data
              ).hexdigest() == meta["git_blob_sha1"], name
          print("pages bootstrap artifact assertions OK")
          PY

          touch site/.nojekyll

      - name: Upload immutable snapshot for post-deploy archive
        uses: actions/upload-artifact@v4
        with:
          name: release-snapshot-${{ github.sha }}
          path: |
            site/releases/${{ github.sha }}
            site/releases/index.json
          if-no-files-found: error
          retention-days: 7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  archive:
    name: Persist immutable release
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout release archive branch
        uses: actions/checkout@v6
        with:
          ref: release-snapshots
          path: archive
          fetch-depth: 1

      - name: Download deployed release snapshot
        uses: actions/download-artifact@v4
        with:
          name: release-snapshot-${{ github.sha }}
          path: incoming

      - name: Verify immutability and persist deployed release
        run: |
          set -euo pipefail
          release="$GITHUB_SHA"
          incoming_release="incoming/$release"
          archive_release="archive/releases/$release"
          test -s "$incoming_release/release-manifest.json"
          test -s "$incoming_release/retrieval-routing-policy.json"
          test -s "$incoming_release/chatbot-search-routing.json"
          test -s "$incoming_release/chatbot-search-protocol.md"
          test -s "$incoming_release/chatbot-entry.txt"
          test -s "$incoming_release/schemas/retrieval-routing-policy.schema.json"
          test -s "$incoming_release/schemas/chatbot-search-routing.schema.json"
          test -s "$incoming_release/index.html"
          test -s "$incoming_release/data/registry-manifest.json"
          test -s "$incoming_release/sources/index.html"
          test -s incoming/index.json
          mkdir -p archive/releases

          if [ -d "$archive_release" ]; then
            diff -qr "$incoming_release" "$archive_release"
          else
            cp -a "$incoming_release" "$archive_release"
          fi
          cp incoming/index.json archive/releases/index.json

          git -C archive config user.name "github-actions[bot]"
          git -C archive config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C archive add releases
          if git -C archive diff --cached --quiet; then
            echo "Release $release already archived with identical content."
            exit 0
          fi
          git -C archive commit -m "archive: immutable release $release"
          git -C archive push origin HEAD:release-snapshots
