name: Validate registry

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate base registry
        run: python3 scripts/validate_registry.py

      - name: Validate source shards, access policies and bilingual coverage
        run: python3 scripts/validate_extensions.py

      - name: Build machine, LLM and source-profile indexes
        run: |
          rm -rf "$RUNNER_TEMP/open-scholarly-sources-site"
          mkdir -p "$RUNNER_TEMP/open-scholarly-sources-site"
          python3 scripts/build_machine_index.py --output "$RUNNER_TEMP/open-scholarly-sources-site"
          python3 scripts/build_source_profiles.py --output "$RUNNER_TEMP/open-scholarly-sources-site"
          test -s "$RUNNER_TEMP/open-scholarly-sources-site/source-profiles.json"
          test -s "$RUNNER_TEMP/open-scholarly-sources-site/source-profiles.ndjson"
          test -s "$RUNNER_TEMP/open-scholarly-sources-site/profiles/index.html"
