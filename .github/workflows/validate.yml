name: Validate registry

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate base registry
        run: python3 scripts/validate_registry.py

      - name: Validate source shards and bilingual coverage
        run: python3 scripts/validate_extensions.py
