name: Validate registry

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - release-snapshots

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply rendered homepage evidence hardening
        if: github.ref == 'refs/heads/fix/rendered-homepage-evidence'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          changed = False

          p = Path('scripts/build_release_snapshot.py')
          s = p.read_text(encoding='utf-8')
          if 'rendered-homepage.html' not in s:
              old = '''    snapshot.mkdir(parents=True)\n    files = {}\n    for name in SNAPSHOT_FILES:\n        source = site / name\n        if not source.is_file():\n            raise SystemExit(f"missing machine output before release snapshot: {name}")\n        destination = snapshot / name\n        shutil.copy2(source, destination)\n        files[name] = file_meta(\n            destination,\n            f"{immutable_base}/{name}",\n            f"{identity['mutable_base']}{name}",\n        )\n\n    schema_dir = snapshot / "schemas"'''
              new = '''    snapshot.mkdir(parents=True)\n    files = {}\n    for name in SNAPSHOT_FILES:\n        source = site / name\n        if not source.is_file():\n            raise SystemExit(f"missing machine output before release snapshot: {name}")\n        destination = snapshot / name\n        shutil.copy2(source, destination)\n        files[name] = file_meta(\n            destination,\n            f"{immutable_base}/{name}",\n            f"{identity['mutable_base']}{name}",\n        )\n\n    # Preserve exact rendered human/crawler surfaces as immutable evidence.\n    # docs/index.html in the repository is only a build template; these files\n    # are copied after static fallback injection and release stamping.\n    homepage = site / "index.html"\n    source_index = site / "sources" / "index.html"\n    if not homepage.is_file() or not source_index.is_file():\n        raise SystemExit("rendered homepage/source index missing before release snapshot")\n    homepage_text = homepage.read_text(encoding="utf-8")\n    if "Static source index / 無 JavaScript 來源索引" not in homepage_text:\n        raise SystemExit("rendered homepage lacks static fallback heading")\n    source_links = set(re.findall(r'href="\\./sources/([a-z0-9-]+)\\.html"', homepage_text))\n    if len(source_links) != source_count:\n        raise SystemExit(\n            f"rendered homepage static source-link count mismatch: {len(source_links)} != {source_count}"\n        )\n    evidence_specs = (\n        (homepage, "rendered-homepage.html", identity["mutable_base"]),\n        (source_index, "rendered-source-index.html", identity["mutable_base"] + "sources/"),\n    )\n    for source, name, mutable_url in evidence_specs:\n        destination = snapshot / name\n        shutil.copy2(source, destination)\n        files[name] = file_meta(\n            destination,\n            f"{immutable_base}/{name}",\n            mutable_url,\n        )\n\n    schema_dir = snapshot / "schemas"'''
              if old not in s:
                  raise SystemExit('snapshot insertion pattern missing')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              changed = True

          p = Path('docs/index.html')
          s = p.read_text(encoding='utf-8')
          if 'DEPLOY-TIME TEMPLATE NOTICE' not in s:
              marker = '  <!-- STATIC_FALLBACK -->'
              notice = '''  <!-- DEPLOY-TIME TEMPLATE NOTICE:\n       This repository file is a template, not the final Pages HTML.\n       scripts/build_static_homepage.py replaces STATIC_FALLBACK during CI/Pages build\n       with one static row per registered source. The exact rendered homepage is then\n       preserved in each immutable release as /releases/<sha>/rendered-homepage.html.\n  -->\n  <!-- STATIC_FALLBACK -->'''
              if marker not in s:
                  raise SystemExit('homepage marker missing')
              s = s.replace(marker, notice, 1)
              s = s.replace('Loading registry…', 'Loading interactive registry…', 1)
              p.write_text(s, encoding='utf-8')
              changed = True

          p = Path('RELEASE_CONSISTENCY.md')
          s = p.read_text(encoding='utf-8')
          section = '''## Template versus deployed HTML\n\n`docs/index.html` in the Git repository is intentionally a **build template**. It contains the `STATIC_FALLBACK` insertion marker and the JavaScript table shell, so inspecting that template alone does not prove or disprove what Pages serves.\n\nDuring CI/Pages build, `scripts/build_static_homepage.py` replaces the marker with one static HTML row per registered source. The release finalizer then stamps the release identity. The exact rendered result is preserved as `/releases/<sha>/rendered-homepage.html`, while the generated static source directory is preserved as `/releases/<sha>/rendered-source-index.html`. Their SHA-256 digests are recorded in that release's manifest.\n\nRelease validation fails unless the rendered homepage contains the static fallback heading and exactly one `./sources/<id>.html` link for every registered source.\n\n'''
          if '## Template versus deployed HTML' not in s:
              anchor = '## Mutable latest endpoints\n'
              if anchor not in s:
                  raise SystemExit('consistency doc anchor missing')
              p.write_text(s.replace(anchor, section + anchor, 1), encoding='utf-8')
              changed = True

          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          sentence = 'The repository copy of `docs/index.html` is only a build template; each immutable release preserves the exact rendered homepage and generated static source index for independent crawler-facing verification.'
          if sentence not in s:
              anchor = 'The immutable snapshots are persisted on the dedicated `release-snapshots` branch **only after the Pages deployment succeeds**. Reusing an existing release SHA with different bytes is a release failure.\n'
              if anchor not in s:
                  raise SystemExit('README release anchor missing')
              p.write_text(s.replace(anchor, anchor + '\n' + sentence + '\n', 1), encoding='utf-8')
              changed = True

          if changed:
              print('Rendered homepage evidence hardening applied')
          else:
              print('Rendered homepage evidence hardening already present')
          PY

          if ! git diff --quiet -- scripts/build_release_snapshot.py docs/index.html RELEASE_CONSISTENCY.md README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/build_release_snapshot.py docs/index.html RELEASE_CONSISTENCY.md README.md
            git commit -m "fix: preserve rendered homepage evidence"
            git push origin HEAD:fix/rendered-homepage-evidence
          fi

      - name: Validate base registry
        run: python3 scripts/validate_registry.py

      - name: Validate source shards, access policies and bilingual coverage
        run: python3 scripts/validate_extensions.py

      - name: Build machine, LLM, profile, homepage and release indexes
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/open-scholarly-sources-site"
          rm -rf "$site"
          mkdir -p "$site/data" "$site/schemas"
          cp docs/index.html "$site/index.html"
          cp data/*.json "$site/data/"
          cp schemas/*.json "$site/schemas/"
          python3 scripts/build_machine_index.py --output "$site"
          python3 scripts/build_source_profiles.py --output "$site"
          python3 scripts/build_static_homepage.py --site "$site"

          release_date="$(git show -s --format=%cI "$GITHUB_SHA")"
          python3 scripts/build_release_snapshot.py \
            --site "$site" \
            --release-id "$GITHUB_SHA" \
            --commit-sha "$GITHUB_SHA" \
            --release-date "$release_date"

          test -s "$site/source-profiles.json"
          test -s "$site/source-profiles.ndjson"
          test -s "$site/profiles/index.html"
          test -s "$site/release-manifest.json"
          test -s "$site/releases/index.json"
          test -s "$site/releases/$GITHUB_SHA/release-manifest.json"
          test -s "$site/releases/$GITHUB_SHA/rendered-homepage.html"
          test -s "$site/releases/$GITHUB_SHA/rendered-source-index.html"
          cmp "$site/index.html" "$site/releases/$GITHUB_SHA/rendered-homepage.html"
          grep -q "Static source index / 無 JavaScript 來源索引" "$site/index.html"
          ! grep -q "<!-- STATIC_FALLBACK -->" "$site/index.html"
          grep -q "$GITHUB_SHA" "$site/index.html"
          grep -q "Release identity: $GITHUB_SHA" "$site/llms.txt"

          python3 scripts/build_release_snapshot.py \
            --site "$site" \
            --release-id "$GITHUB_SHA" \
            --commit-sha "$GITHUB_SHA" \
            --release-date "$release_date"

          python3 - "$site" "$GITHUB_SHA" <<'PY'
          import hashlib, json, re, sys
          from pathlib import Path
          site=Path(sys.argv[1]); sha=sys.argv[2]
          manifest=json.loads((site/'release-manifest.json').read_text())
          registry=json.loads((site/'registry.json').read_text())
          profiles=json.loads((site/'source-profiles.json').read_text())
          history=json.loads((site/'releases/index.json').read_text())
          assert manifest['release_id']==sha==manifest['commit_sha']
          assert registry['release']['release_id']==sha
          assert profiles['release']['release_id']==sha
          assert history['current_release_id']==sha
          assert manifest['source_count']==len(registry['sources'])
          assert manifest['profile_schema_version']==profiles['schema_version']
          assert 'rendered-homepage.html' in manifest['files']
          assert 'rendered-source-index.html' in manifest['files']
          snapshot=site/'releases'/sha
          page=(snapshot/'rendered-homepage.html').read_text(encoding='utf-8')
          source_ids=set(re.findall(r'href="\\./sources/([a-z0-9-]+)\\.html"', page))
          assert len(source_ids)==manifest['source_count'], (len(source_ids), manifest['source_count'])
          assert 'Static source index / 無 JavaScript 來源索引' in page
          assert '<!-- STATIC_FALLBACK -->' not in page
          for name, meta in manifest['files'].items():
              data=(snapshot/name).read_bytes()
              assert hashlib.sha256(data).hexdigest()==meta['sha256'], name
          print('Release and rendered-homepage evidence assertions OK')
          PY