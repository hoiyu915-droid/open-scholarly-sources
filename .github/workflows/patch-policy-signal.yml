name: Narrow policy-signal profile routing

on:
  push:
    branches:
      - fix/profile-policy-signal-scope
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/profile-policy-signal-scope
          fetch-depth: 0

      - name: Patch, validate and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('scripts/build_source_profiles.py')
          s=p.read_text(encoding='utf-8')
          old='    if subs&POLICY and (frontierish or any(x in nn for x in ("working paper","discussion paper"))): a.add("policy_signal")'
          new='    if subs&POLICY and any(x in nn for x in ("working paper","discussion paper")): a.add("policy_signal")'
          if old not in s: raise SystemExit('policy_signal routing pattern missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          rp=Path('data/source-profile-rules.json')
          r=json.loads(rp.read_text(encoding='utf-8'))
          r['schema_version']='0.2.2'
          r['method']='deterministic_source_use_profile_v2_2'
          n=r['overrides']['nutrixiv']
          n['add_archetypes']=sorted(set(n.get('add_archetypes',[]))|{'archive_backbone'})
          n['remove_archetypes']=sorted(set(n.get('remove_archetypes',[]))|{'discovery_infrastructure'})
          rp.write_text(json.dumps(r,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          PY

          python3 -m py_compile scripts/build_source_profiles.py
          python3 scripts/validate_registry.py
          python3 scripts/validate_extensions.py

          site="$RUNNER_TEMP/policy-signal-site"
          rm -rf "$site"
          mkdir -p "$site/data" "$site/schemas"
          cp docs/index.html "$site/index.html"
          cp data/*.json "$site/data/"
          cp schemas/*.json "$site/schemas/"
          python3 scripts/build_machine_index.py --output "$site"
          python3 scripts/build_source_profiles.py --output "$site"
          python3 scripts/build_static_homepage.py --site "$site"

          python3 - "$site" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          reg=json.loads((root/'registry.json').read_text())
          by={x['id']:x for x in reg['sources']}
          def p(sid): return by[sid]['source_profile']
          for sid in ('arxiv','apsa-preprints','medrxiv','preprints-with-the-lancet','sportrxiv','newaddictionsx','law-archive'):
              assert 'policy_signal' not in p(sid)['archetypes'], (sid,p(sid)['archetypes'])
          for sid in ('nber-working-papers','bank-of-england-staff-working-papers','bis-working-papers','ecb-working-paper-series','federal-reserve-feds','federal-reserve-ifdp','imf-working-papers','world-bank-prwp','mpra'):
              assert 'policy_signal' in p(sid)['archetypes'], (sid,p(sid)['archetypes'])
          n=p('nutrixiv')
          assert n['tier']=='A1'
          assert 'archive_backbone' in n['archetypes']
          assert 'historical_preprint_archive' in n['archetypes']
          assert 'discovery_infrastructure' not in n['archetypes']
          for sid in ('arxiv','arxiv-cs-ai','arxiv-cs-cl','arxiv-cs-cv','arxiv-cs-lg','arxiv-cs-ma','arxiv-stat-ml'):
              q=p(sid)
              assert q['tier']=='F1'
              assert 'frontier_scout' in q['archetypes']
              assert q['scores']['frontier_velocity']==4 and q['scores']['noise_risk']==4
          payload=json.loads((root/'source-profiles.json').read_text())
          assert payload['schema_version']=='0.2.2'
          assert payload['method']=='deterministic_source_use_profile_v2_2'
          assert len(reg['sources'])==227
          assert all('provenance' in x['source_profile'] for x in reg['sources'])
          print('Policy-signal routing assertions OK')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/build_source_profiles.py data/source-profile-rules.json
          git diff --cached --stat
          git commit -m "fix: narrow policy-signal source profiles"
          git push origin HEAD:fix/profile-policy-signal-scope
