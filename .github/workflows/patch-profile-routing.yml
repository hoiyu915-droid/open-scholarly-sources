name: Refine source-profile routing semantics

on:
  push:
    branches:
      - fix/profile-routing-cleanup
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v6
        with:
          ref: fix/profile-routing-cleanup
          fetch-depth: 0

      - name: Refine routing rules, validate and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          p=Path('scripts/build_source_profiles.py')
          s=p.read_text(encoding='utf-8')
          def repl(old,new,label):
              global s
              if old not in s: raise SystemExit(f'{label} pattern missing')
              s=s.replace(old,new,1)

          repl(
              '    peer,pub,typ=s["peer_review_scope"],s["publication_state"],s["source_type"]\n    subs=set(s.get("subjects") or [])',
              '    peer,pub,typ=s["peer_review_scope"],s["publication_state"],s["source_type"]\n    frontierish=pub=="preprint" or (typ=="subject_repository" and peer=="not_peer_reviewed" and pub=="mixed" and s["status"]=="active")\n    subs=set(s.get("subjects") or [])',
              'score prelude')
          repl(
              '    rigor=4 if peer=="peer_reviewed" and pub=="published" else 3 if peer=="peer_reviewed" else 2 if peer=="mixed" or pub=="mixed" else 1 if peer=="not_peer_reviewed" and pub=="preprint" else 0',
              '    rigor=4 if peer=="peer_reviewed" and pub=="published" else 3 if peer=="peer_reviewed" else 1 if peer=="not_peer_reviewed" and frontierish else 2 if peer=="mixed" or pub=="mixed" else 0',
              'rigor')
          repl(
              '    velocity=4 if pub=="preprint" or typ=="review_platform" else 3 if {"preprint","accepted_manuscript"}&vers else 2 if typ in {"journal","journal_collection","proceedings_series"} else 1 if typ in REPOS|DISC else 2',
              '    velocity=4 if frontierish or typ=="review_platform" else 3 if {"preprint","accepted_manuscript"}&vers else 2 if typ in {"journal","journal_collection","proceedings_series"} else 1 if typ in REPOS|DISC else 2',
              'velocity')
          repl(
              '    signal=4 if peer=="peer_reviewed" and pub=="published" else 3 if peer=="peer_reviewed" else (3 if spec>=4 else 2) if peer=="mixed" or pub=="preprint" else 2',
              '    signal=4 if peer=="peer_reviewed" and pub=="published" else 3 if peer=="peer_reviewed" else (3 if spec>=4 else 2) if peer=="mixed" or frontierish else 2',
              'signal')
          repl(
              '    noise=4 if peer=="not_peer_reviewed" and pub=="preprint" else 3 if peer=="mixed" or pub=="mixed" else 2 if typ in DISC or typ=="review_platform" else 1 if peer=="peer_reviewed" else 2',
              '    noise=4 if peer=="not_peer_reviewed" and frontierish else 3 if peer=="mixed" or pub=="mixed" else 2 if typ in DISC or typ=="review_platform" else 1 if peer=="peer_reviewed" else 2',
              'noise')

          repl(
              '    typ,pub=s["source_type"],s["publication_state"]\n    if typ in DISC or typ=="review_platform": return "D1"\n    if typ in REPOS and pub!="preprint": return "A1"\n    if pub=="preprint":\n        return "F1" if s["status"]=="active" and s["verification"]["status"]=="verified" and s.get("parent_id")!="osf-preprints" else "F2"',
              '    typ,pub=s["source_type"],s["publication_state"]\n    frontierish=pub=="preprint" or (typ=="subject_repository" and s["peer_review_scope"]=="not_peer_reviewed" and pub=="mixed" and s["status"]=="active")\n    if typ in DISC or typ=="review_platform": return "D1"\n    if frontierish:\n        return "F1" if s["status"]=="active" and s["verification"]["status"]=="verified" and s.get("parent_id")!="osf-preprints" else "F2"\n    if typ in REPOS: return "A1"',
              'tier')

          repl(
              '    nn=(s["name"]+" "+s.get("notes","")).casefold()\n    if t=="R1": a.add("formal_anchor")\n    if s["publication_state"]=="preprint": a.add("frontier_scout")',
              '    nn=(s["name"]+" "+s.get("notes","")).casefold()\n    frontierish=s["publication_state"]=="preprint" or (s["source_type"]=="subject_repository" and s["peer_review_scope"]=="not_peer_reviewed" and s["publication_state"]=="mixed" and s["status"]=="active")\n    if t=="R1": a.add("formal_anchor")\n    if s["status"]=="active" and frontierish: a.add("frontier_scout")',
              'archetype prelude')
          repl(
              '    if s["publication_state"]=="preprint" and subs&CLINICAL: a.add("clinical_early_warning")\n    if subs&POLICY and any(x in nn for x in ("working paper","discussion paper","policy","econom")): a.add("policy_signal")\n    if s.get("parent_id")=="osf-preprints": a.add("community_hub")',
              '    if s["status"]=="active" and frontierish and subs&CLINICAL: a.add("clinical_early_warning")\n    if subs&POLICY and (frontierish or any(x in nn for x in ("working paper","discussion paper"))): a.add("policy_signal")\n    if s["status"]=="active" and s.get("parent_id")=="osf-preprints": a.add("community_hub")',
              'active/policy archetypes')
          p.write_text(s,encoding='utf-8')

          rp=Path('data/source-profile-rules.json')
          r=json.loads(rp.read_text(encoding='utf-8'))
          r['schema_version']='0.2.1'
          r['method']='deterministic_source_use_profile_v2_1'
          n=r['overrides']['nutrixiv']
          n['remove_archetypes']=sorted(set(n.get('remove_archetypes',[]))|{'frontier_scout','clinical_early_warning','community_hub'})
          rp.write_text(json.dumps(r,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          PY

          python3 -m py_compile scripts/build_source_profiles.py
          python3 scripts/validate_registry.py
          python3 scripts/validate_extensions.py

          site="$RUNNER_TEMP/profile-routing-site"
          rm -rf "$site"
          mkdir -p "$site/data" "$site/schemas"
          cp docs/index.html "$site/index.html"
          cp data/*.json "$site/data/"
          cp schemas/*.json "$site/schemas/"
          python3 scripts/build_machine_index.py --output "$site"
          python3 scripts/build_source_profiles.py --output "$site"
          python3 scripts/build_static_homepage.py --site "$site"

          python3 - "$site" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          ss={x['id']:x for x in json.loads((root/'registry.json').read_text())['sources']}
          def prof(sid): return ss[sid]['source_profile']
          for sid in ('arxiv','arxiv-cs-ai','arxiv-cs-cl','arxiv-cs-cv','arxiv-cs-lg','arxiv-cs-ma','arxiv-stat-ml'):
              p=prof(sid)
              assert p['tier']=='F1', (sid,p['tier'])
              assert 'frontier_scout' in p['archetypes'], (sid,p['archetypes'])
              assert p['scores']['frontier_velocity']==4, (sid,p['scores'])
              assert p['scores']['noise_risk']==4, (sid,p['scores'])
          n=prof('nutrixiv')
          assert n['tier']=='A1'
          for a in ('frontier_scout','clinical_early_warning','community_hub'):
              assert a not in n['archetypes'], n['archetypes']
          for sid in ('current-developments-nutrition','plos-medicine','theoretical-economics'):
              assert 'policy_signal' not in prof(sid)['archetypes'], (sid,prof(sid)['archetypes'])
          assert 'policy_signal' in prof('nber-working-papers')['archetypes']
          payload=json.loads((root/'source-profiles.json').read_text())
          assert payload['schema_version']=='0.2.1'
          assert payload['method']=='deterministic_source_use_profile_v2_1'
          print('Routing cleanup assertions OK')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/build_source_profiles.py data/source-profile-rules.json
          git diff --cached --stat
          git commit -m "fix: refine frontier and policy profile routing"
          git push origin HEAD:fix/profile-routing-cleanup
